packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  nx: true
  workerd: true

overrides:
  # drizzle-kit 0.31.11 lists this loader, and no file of it loads it (FRU-180). It brings esbuild
  # 0.18.20, which `pnpm audit --prod` reports: better-auth names drizzle-kit as a peer, so pnpm counts
  # it with the production dependencies of the worker. Read it again when drizzle-kit changes.
  'drizzle-kit>@esbuild-kit/esm-loader': '-'

catalog:
  '@electric-sql/pglite': 0.5.11
  '@types/node': 26.6.5
  '@types/pg': 8.23.1
  better-auth: 1.7.12
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  esbuild: ^0.28.2
  happy-dom: ^21.0.4
  oxfmt: ^0.74.0
  react-grab: 0.2.0
  oxlint: ^1.89.0
  pg: 8.23.1
  typescript: 7.0.2
  vitest: 5.0.5
  yaml: ^2.9.1
  zod: ~4.6.7
