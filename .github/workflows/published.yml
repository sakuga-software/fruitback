name: Published

# The last published npm packages and the last released extension, against the worker of this
# commit (FRU-460). The people who use Fruitback run those copies, and a worker deployed from `main`
# serves them: a change of the worker that breaks them fails here. See dev-loop.md.
#
# Not a job of `ci.yml`: the CI of a pull request has a budget of 4 minutes, and this job boots the
# servers of the E2E suite again. It runs after each merge, every night (a new release changes what
# it fetches with no commit here), by hand with a version to pin, on a pull request that changes the
# suite itself, and on the pull request of a version (FRU-612).
#
# The pull request « chore: version x.y.z » of `version.yml` moves the version of the extension. On
# it, the extension is not the last release but the archive this commit builds, the one the stores
# will get: a published spec that still reads the words of the last release fails here, and is fixed
# in the same pull request. Before, it passed until the release, then failed on every commit of
# `main` (FRU-555, 0.7.0).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - e2e/published/**
      - playwright.published.config.ts
      - .github/workflows/published.yml
      # The version of the extension. A pull request that changes only its dependencies runs the
      # last release, as before: `extension-release.ts` reads whether the version moved.
      - apps/extension/package.json
  schedule:
    # 04:41 UTC: after the night, before the day. The minute is not the one every repository picks.
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      npm:
        description: The npm version to test, for example 0.4.0. Empty is the `latest` tag.
        required: false
        default: ''
      extension:
        description: The extension version to test, for example 0.4.0. Empty is the latest release.
        required: false
        default: ''

permissions:
  contents: read

# As in `ci.yml`: a push to a pull request cancels the run before it, a commit of `main` keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  published:
    name: published npm and extension
    runs-on: ubuntu-latest
    # The image of `ci.yml`'s `e2e-shard`, for the same reason: no `playwright install`.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    timeout-minutes: 15

    steps:
      - name: Note when the job starts
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of a pull request and its first parent, the head of its base:
          # `extension-release.ts` compares the version of the extension on both.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # FRU-612. `archive=` the archive to build, or nothing when the version did not move.
      - name: Does this pull request move the version of the extension?
        id: extension
        if: github.event_name == 'pull_request'
        run: node tools/ci/extension-release.ts >> "$GITHUB_OUTPUT"

      # The playground, which is the site of the specs, reads the built widget of this commit. The
      # extension bundles them too.
      - name: Build what the playground reads
        run: pnpm --filter @fruitback/shared build && pnpm --filter @fruitback/widget build

      # The command of the job `package` of `release-extension.yml`: a production build for Chrome,
      # with the version of `apps/extension/package.json`, which the tag will name. Nothing leaves
      # the run: no store, no release, no key.
      - name: Build the extension that this pull request releases
        if: steps.extension.outputs.archive != ''
        run: pnpm --filter @fruitback/extension zip

      # From npm and from the GitHub release, both public, or the archive built above. The token only
      # raises the rate limit of the GitHub API, and it can read this public repository and nothing
      # more.
      - name: Fetch the published packages and extension
        env:
          FRUITBACK_PUBLISHED_VERSION: ${{ inputs.npm }}
          FRUITBACK_PUBLISHED_EXTENSION: ${{ inputs.extension }}
          FRUITBACK_PUBLISHED_EXTENSION_ARCHIVE: ${{ steps.extension.outputs.archive }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node e2e/published/fetch.ts

      - name: Run the published code against this worker
        run: pnpm exec playwright test -c playwright.published.config.ts

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-published
          path: test-results/
          retention-days: 7

      - name: Write the durations
        if: always()
        continue-on-error: true
        run: node tools/ci/durations.ts --name published --timeout 15
