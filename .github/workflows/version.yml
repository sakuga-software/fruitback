name: Version

# The pull request of the next version, and the release of a version that `main` has and no tag
# has (FRU-728). See « Publishing to npm » in packaging.md.
#
# - `plan` runs the code of the repository (`pnpm changeset version`) with no secret, and only
#   reads. What it changes leaves it as a patch.
# - `pull-request` writes `release/next` from that patch and opens or updates « chore: version x.y.z ».
# - `release` publishes the release `vx.y.z` of the commit: the release makes the tag, and starts
#   `release-npm.yml`, `release-extension.yml` and `release-image.yml`, which call `ci.yml` on the
#   tag and wait for a person to approve the environments `npm` and `stores`.
#
# The two jobs that write use a token of the App: GitHub starts no workflow for a pull request or a
# release made with the token of a run, so `ci.yml` would not run on the pull request, and the
# release would publish nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, and none cancelled: a merge of a version must keep the run that releases it.
concurrency:
  group: version
  cancel-in-progress: false

jobs:
  plan:
    name: plan the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release: ${{ steps.release.outputs.release }}
      current: ${{ steps.release.outputs.version }}
      pending: ${{ steps.next.outputs.pending }}
      next: ${{ steps.next.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tags, to know which version has its release.
          fetch-depth: 0

      # The version of `main` is the one of the root `package.json`, moved with the `fixed` group.
      # It is released when no tag names it and it is newer than every tag `v*`.
      - name: Is the version of this commit released?
        id: release
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version exists."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No `| head`: under `pipefail`, its early exit can fail the line.
          tags=$(git tag --list 'v*' --sort=-v:refname)
          newest=${tags%%$'\n'*}
          top=$(printf '%s\n%s\n' "${newest#v}" "$version" | sort -V | tail -n 1)
          if [ "$top" = "$version" ]; then
            echo "v$version is new: released by this run."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is older than $newest: not released." >&2
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      # No cache, as in `guide` of release-extension.yml: what this job writes goes to a pull request.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `changeset version` moves the nine packages of the `fixed` group and writes their changelogs.
      # The root `package.json` is outside the workspace packages: it takes the version of the group.
      - name: Write the next version as a patch
        id: next
        run: |
          set -euo pipefail
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md | wc -l | tr -d ' ')
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          if [ "$pending" = "0" ]; then
            echo "No changeset waits."
            exit 0
          fi
          pnpm exec changeset version
          version=$(node -p "require('./apps/extension/package.json').version")
          node -e "
            const fs = require('node:fs');
            const root = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            root.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(root, null, 2) + '\n');
          " "$version"
          pnpm exec oxfmt package.json apps/*/CHANGELOG.md packages/*/CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/version"
          git add -A -- .changeset package.json 'apps/*/package.json' 'apps/*/CHANGELOG.md' 'packages/*/package.json' 'packages/*/CHANGELOG.md'
          git diff --cached --binary > "$RUNNER_TEMP/version/version.patch"
          git diff --cached --stat
          ls .changeset

      - name: Keep the patch
        if: steps.next.outputs.pending != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version
          path: ${{ runner.temp }}/version/version.patch
          if-no-files-found: error
          retention-days: 7

  # Runs no code of the repository: a checkout of the commit, `git apply`, `git push` and `gh`.
  pull-request:
    name: pull request of the version
    needs: [plan]
    if: needs.plan.outputs.pending != '0' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: the commits of `release/next` are read against the commit of the run.
          fetch-depth: 0

      - name: Take the patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version
          path: ${{ runner.temp }}/version

      - name: Token of the App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # The Client ID of the App: not a secret.
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the pull request of the version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ needs.plan.outputs.next }}
          PENDING: ${{ needs.plan.outputs.pending }}
        run: |
          set -euo pipefail
          branch=release/next
          id=$(gh api "/users/${APP}%5Bbot%5D" --jq .id)
          email="${id}+${APP}[bot]@users.noreply.github.com"
          # The patch comes from a job that ran the code of the repository: it may touch the files of
          # a version and nothing else.
          outside=$(git apply --numstat "$RUNNER_TEMP/version/version.patch" | cut -f3 |
            grep -Ev '^(package\.json|(apps|packages)/[^/]+/(package\.json|CHANGELOG\.md)|\.changeset/[^/]+\.md)$' || true)
          if [ -n "$outside" ]; then
            echo "the patch touches files out of a version: $outside" >&2
            exit 1
          fi
          git switch -c "$branch"
          git apply --index --binary "$RUNNER_TEMP/version/version.patch"
          git -c user.name="${APP}[bot]" -c user.email="$email" \
            commit -m "chore: version $VERSION" -m "pnpm changeset version consumed $PENDING changesets and wrote the CHANGELOG.md of each package. The root package.json takes the version of the fixed group. Written by version.yml."
          # The branch is written again from `main` at each run. It is replaced only when every commit
          # on it since `main` is this job's own, and only from the head it read. A commit that a
          # person pushed there stops the job, and stays.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"
          held=$(git ls-remote "$remote" "refs/heads/$branch" | cut -f1)
          if [ -z "$held" ]; then
            git push "$remote" "HEAD:refs/heads/$branch"
          else
            git fetch --quiet --no-tags "$remote" "refs/heads/$branch"
            others=$(git log --format='%ae' "$GITHUB_SHA..FETCH_HEAD" | grep -vFx "$email" || true)
            if [ -n "$others" ]; then
              echo "$branch holds commits that this job did not write ($others): left as it is." >&2
              exit 1
            fi
            git push --force-with-lease="refs/heads/$branch:$held" "$remote" "HEAD:refs/heads/$branch"
          fi
          {
            echo "The packages, the extension and the image move to **$VERSION** together. \`pnpm changeset version\` consumed $PENDING changesets; see the \`CHANGELOG.md\` of each package. Written by \`version.yml\`, and written again at each merge to \`main\` that adds a changeset."
            echo
            echo "**Merging this pull request releases $VERSION:** \`version.yml\` publishes the release \`v$VERSION\` on GitHub, which makes the tag and starts \`release-npm.yml\`, \`release-extension.yml\` and \`release-image.yml\`. Then approve the environments \`npm\` and \`stores\`."
            echo
            echo "Before the merge: read the changelogs, and check that \`apps/extension/wxt.config.ts\` asks for no new permission since the last tag."
          } > "$RUNNER_TEMP/version/body.md"
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$open" ]; then
            gh pr create --base main --head "$branch" --title "chore: version $VERSION" --body-file "$RUNNER_TEMP/version/body.md"
          else
            gh pr edit "$open" --title "chore: version $VERSION" --body-file "$RUNNER_TEMP/version/body.md"
          fi

  # Runs no code of the repository: `gh release create` on the commit of this run.
  release:
    name: release of the version
    needs: [plan]
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Token of the App
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          # The Client ID of the App: not a secret.
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Publish the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.current }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --generate-notes
