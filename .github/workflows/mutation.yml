name: Mutation

# StrykerJS changes the code one mutant at a time and runs the tests: a mutant that every test lets
# live is a line no test holds (FRU-172). The score of a file may not go down:
# `tools/mutation/ratchet.ts` compares each run with `tools/mutation/baseline.json`.
#
# On a pull request, only the files that it changes, in the scope of `stryker.config.json`. Every
# file of that scope on a schedule, by hand, and on a pull request that changes how mutation runs,
# because the lines depend on it.
#
# Each file is mutated by a job of its own (FRU-336): the 8 files of the worker in one job ran out
# of its 150 minutes from 2026-10-19. `plan` lists the jobs, and `line` holds the line of a package
# on a full run, from the reports of all its jobs. See conventions.md.
#
# On a pull request the mutation reports and does not block: a line that is not held is a
# `::warning::`, and a job that fails or runs out of time does not fail the run. On `main`, on the
# schedule and by hand, both still fail. See conventions.md.
on:
  pull_request:
  schedule:
    # Monday 03:17 UTC: no one waits for it, and the minute is not the one every repository picks.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `scope.ts` needs Node and git, and no install: a pull request with nothing to mutate stops here.
  plan:
    name: mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      count: ${{ steps.scope.outputs.count }}
      full: ${{ steps.scope.outputs.full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff of a pull request is taken from its base, which a shallow clone does not hold.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Choose what to mutate
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/mutation/scope.ts "$EVENT" "$BASE" packages/shared apps/worker >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation ${{ matrix.package }} ${{ matrix.file }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # Blocking on `main`, on the schedule and by hand; a report only on a pull request.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    # One file of the worker: 60 minutes for the 215 mutants of clients.ts on 2026-10-20, its dry
    # run of 7 minutes included. See conventions.md.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      # FRU-343. The last step reads it to write what the job took.
      - name: Note when the job starts
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # StrykerJS is installed apart, from `tools/mutation/pnpm-lock.yaml`: in the workspace it adds
      # 125 packages to every install, Babel among them, for one job.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile --ignore-workspace --dir tools/mutation

      # `inPlace`: the guard tests of the worker read files of the root, and a sandbox would move
      # them out of reach. This checkout is thrown away after the job.
      # 3 runners on the 4 vCPU of the job, not 4: with 4, mutants that are killed late run out of
      # their budget and count as killed by a timeout, survivors included (FRU-345, conventions.md).
      - name: Mutate
        id: mutate
        working-directory: ${{ matrix.package }}
        env:
          MUTATE: ${{ matrix.file }}
        run: ../../tools/mutation/node_modules/.bin/stryker run --mutate "$MUTATE" --concurrency 3 --fileLogLevel info

      # The line of the file. The line of the package needs every file: `line` holds it.
      - name: Hold the line
        id: hold
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          node tools/mutation/ratchet.ts check "$PACKAGE" "$PACKAGE/reports/mutation/mutation.json" |
            tee -a "$GITHUB_STEP_SUMMARY"

      # A pull request goes on with a line that is not held, and says so where it is read.
      - name: Say that the line of the file is not held
        if: steps.hold.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "::warning title=mutation::$PACKAGE is under its line, or a file of it was not measured (see the summary of this job). This does not block a pull request; it fails on main."

      # A pull request goes on when StrykerJS failed or ran out of time too, and says so: no line
      # was held, and the job would read as green.
      - name: Say that the file was not measured
        if: always() && steps.mutate.outcome != 'success'
        env:
          PACKAGE: ${{ matrix.package }}
          MUTATE: ${{ matrix.file }}
        run: echo "::warning title=mutation::$PACKAGE $MUTATE was not measured, StrykerJS stopped (see the log of the step Mutate). This does not block a pull request; it fails on main."

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}/reports/mutation/
          retention-days: 30
          if-no-files-found: error

      # FRU-343. What the job and its dry run took, against `timeout-minutes` and `dryRunTimeoutMinutes`:
      # a warning past 60 %, never a failure. `--fileLogLevel info` above writes the log it reads.
      - name: Write the durations
        if: always()
        continue-on-error: true
        env:
          NAME: mutation ${{ matrix.package }} ${{ matrix.file }}
          PACKAGE: ${{ matrix.package }}
        run: node tools/ci/durations.ts --name "$NAME" --timeout 150 --stryker "$PACKAGE"

  # On `main`, the schedule and by hand, runs only when every job of `mutation` passed: a job that
  # failed or ran out of time has failed the run already. On a pull request, `continue-on-error`
  # counts such a job as passed, so this runs too, finds the file that was not measured, and warns.
  line:
    name: mutation line ${{ matrix.package }}
    needs: [plan, mutation]
    if: needs.plan.outputs.full != '[]'
    runs-on: ubuntu-latest
    # Blocking on `main`, on the schedule and by hand; a report only on a pull request.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.full) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set the name of the reports
        id: slug
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "slug=${PACKAGE//\//-}" >> "$GITHUB_OUTPUT"

      - name: Take the reports of the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation--${{ steps.slug.outputs.slug }}--*
          path: reports

      - name: Hold the line of the package
        id: hold
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          node tools/mutation/ratchet.ts check "$PACKAGE" reports/*/mutation.json --full |
            tee -a "$GITHUB_STEP_SUMMARY"

      # A pull request goes on with a line that is not held, and says so where it is read.
      - name: Say that the line of the package is not held
        if: steps.hold.outcome == 'failure'
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "::warning title=mutation::$PACKAGE is under its line, or a file of it was not measured (see the summary of this job). This does not block a pull request; it fails on main."
