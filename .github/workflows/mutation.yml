name: Mutation

# StrykerJS changes the code one mutant at a time and runs the tests: a mutant that every test lets
# live is a line no test holds (FRU-172). The score of a file may not go down:
# `tools/mutation/ratchet.ts` compares each run with `tools/mutation/baseline.json`.
#
# On a pull request, only the files that it changes, in the scope of `stryker.config.json`. Every
# file of that scope on a schedule, by hand, and on a pull request that changes how mutation runs,
# because the lines depend on it.
#
# Each file is mutated by a job of its own (FRU-336): the 8 files of the worker in one job ran out
# of its 150 minutes from 2026-10-19. A file that `tools/mutation/parts.json` cuts has a job for each
# part (FRU-340): `identity.ts` alone took 81 minutes on 2026-10-21. `plan` lists the jobs, and `line`
# holds the line of each package that has one, from the reports of all its jobs. See conventions.md.
on:
  pull_request:
  schedule:
    # Monday 03:17 UTC: no one waits for it, and the minute is not the one every repository picks.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `scope.ts` needs Node and git, and no install: a pull request with nothing to mutate stops here.
  plan:
    name: mutation plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      count: ${{ steps.scope.outputs.count }}
      full: ${{ steps.scope.outputs.full }}
      packages: ${{ steps.scope.outputs.packages }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff of a pull request is taken from its base, which a shallow clone does not hold.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Choose what to mutate
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/mutation/scope.ts "$EVENT" "$BASE" packages/shared apps/worker >> "$GITHUB_OUTPUT"

  mutation:
    name: mutation ${{ matrix.package }} ${{ matrix.file }}${{ matrix.lines != '' && format(' lines {0}', matrix.lines) || '' }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    # One file of the worker, or one part of it: 81 minutes for the 224 mutants of identity.ts on
    # 2026-10-21, its dry run of 10 minutes included, before it was cut. See conventions.md.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # StrykerJS is installed apart, from `tools/mutation/pnpm-lock.yaml`: in the workspace it adds
      # 125 packages to every install, Babel among them, for one job.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile --ignore-workspace --dir tools/mutation

      # `inPlace`: the guard tests of the worker read files of the root, and a sandbox would move
      # them out of reach. This checkout is thrown away after the job. A part mutates from its first
      # line to the end of the file, and `part-ignorer.ts` leaves out what starts after `last`.
      - name: Mutate
        working-directory: ${{ matrix.package }}
        env:
          MUTATE: ${{ matrix.mutate }}
          MUTATION_LAST_LINE: ${{ matrix.last }}
        run: ../../tools/mutation/node_modules/.bin/stryker run --mutate "$MUTATE" --concurrency 4

      # The line of the file. A part holds some mutants of its file only, so it prints its score, and
      # `line` holds the line of its file on the reports of all its parts, and the line of the package.
      - name: Hold the line
        env:
          PACKAGE: ${{ matrix.package }}
          LINES: ${{ matrix.lines }}
        run: |
          set -o pipefail
          node tools/mutation/ratchet.ts check "$PACKAGE" "$PACKAGE/reports/mutation/mutation.json" ${LINES:+--part} |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}/reports/mutation/
          retention-days: 30
          if-no-files-found: error

  # Runs only when every job of `mutation` passed: a job that failed or ran out of time has failed
  # the run already. It runs for each package that had a job, so that the parts of a file are held
  # together on a pull request too, and fails when a job of the plan left no report.
  line:
    name: mutation line ${{ matrix.package }}
    needs: [plan, mutation]
    if: needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set the name of the reports
        id: slug
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "slug=${PACKAGE//\//-}" >> "$GITHUB_OUTPUT"

      - name: Take the reports of the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation--${{ steps.slug.outputs.slug }}--*
          path: reports

      # The plan says which reports there must be, a part of a file included, and which packages
      # were mutated in full.
      - name: Hold the line of the package
        env:
          PACKAGE: ${{ matrix.package }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -o pipefail
          node tools/mutation/ratchet.ts line "$PACKAGE" reports "$MATRIX" "$FULL" |
            tee -a "$GITHUB_STEP_SUMMARY"
