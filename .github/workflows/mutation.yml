name: Mutation

# StrykerJS changes the code one mutant at a time and runs the tests: a mutant that every test lets
# live is a line no test holds (FRU-172). The score of a file may not go down:
# `tools/mutation/ratchet.ts` compares each run with `tools/mutation/baseline.json`.
#
# On a pull request, only the files that it changes, in the scope of `stryker.config.json`. Every
# file of that scope on a schedule, by hand, and on a pull request that changes how mutation runs,
# because the lines depend on it.
on:
  pull_request:
  schedule:
    # Monday 03:17 UTC: no one waits for it, and the minute is not the one every repository picks.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    name: mutation ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: [packages/shared, apps/worker]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff of a pull request is taken from its base, which a shallow clone does not hold.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # StrykerJS is installed apart, from `tools/mutation/pnpm-lock.yaml`: in the workspace it adds
      # 125 packages to every install, Babel among them, for one job.
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm install --frozen-lockfile --ignore-workspace --dir tools/mutation

      - name: Choose what to mutate
        id: scope
        env:
          PACKAGE: ${{ matrix.package }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/mutation/scope.ts "$PACKAGE" "$EVENT" "$BASE" >> "$GITHUB_OUTPUT"

      # `inPlace`: the guard tests of the worker read files of the root, and a sandbox would move
      # them out of reach. This checkout is thrown away after the job.
      - name: Mutate
        if: steps.scope.outputs.mutate != ''
        working-directory: ${{ matrix.package }}
        env:
          MUTATE: ${{ steps.scope.outputs.mutate }}
        run: ../../tools/mutation/node_modules/.bin/stryker run --mutate "$MUTATE" --concurrency 4

      - name: Hold the line
        if: steps.scope.outputs.mutate != ''
        env:
          PACKAGE: ${{ matrix.package }}
          FULL: ${{ steps.scope.outputs.full }}
        run: |
          set -o pipefail
          node tools/mutation/ratchet.ts check "$PACKAGE" "$PACKAGE/reports/mutation/mutation.json" $FULL |
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always() && steps.scope.outputs.mutate != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-${{ strategy.job-index }}
          path: ${{ matrix.package }}/reports/mutation/
          retention-days: 30
          if-no-files-found: error
