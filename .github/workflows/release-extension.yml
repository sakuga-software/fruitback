name: Release extension

# The archives a store takes, built from the tag rather than from somebody's machine (FRU-77).
# Its own workflow, and not a job of `release-image.yml`: that one builds a container for two
# architectures, this one builds two browser archives, and neither has a reason to wait for the
# other. A published release starts it: `release-npm.yml` says why a release, and not a pushed tag.
on:
  release:
    types: [published]
  workflow_dispatch:

# Read-only for every job. Only `publish` may write, and only on a tag (FRU-70).
permissions:
  contents: read

concurrency:
  group: release-extension-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks of ci.yml on the tagged commit (FRU-172). A tag can name any commit, and before this
  # the archives of a commit that failed its tests were attached to the release.
  ci:
    name: ci
    uses: $/.github/workflows/ci.yml
    # The job `docker image` of ci.yml reads the cache of its layers in the registry (FRU-344). A
    # called workflow gets no permission that its caller does not give, and the run does not start.
    permissions:
      contents: read
      packages: read

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      # **Nothing is restored from a cache here**, which is what tells this workflow from `ci.yml`.
      # A cache is writable by any run of this repository, and what this job builds is shipped to a
      # store: a poisoned entry would reach the archive rather than a test. `zizmor` fails on it.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The manifest takes its version from the package, and a store refuses an upload whose version
      # is not higher than the last one. A tag that says something else would publish a number nobody
      # chose, so the two are compared here rather than discovered on the store.
      - name: The tag and the manifest name the same version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          declared=$(node -p "require('./apps/extension/package.json').version")
          if [ "$TAG" != "v$declared" ]; then
            echo "the tag is $TAG and apps/extension/package.json says $declared" >&2
            exit 1
          fi

      - name: Build what the extension bundles
        run: pnpm --filter @fruitback/shared build && pnpm --filter @fruitback/widget build

      # Firefox gets a second archive of the sources, which AMO asks for whenever the submitted file
      # was built. `wxt zip -b firefox` writes both.
      - name: Zip for Chrome and for Firefox
        run: pnpm --filter @fruitback/extension zip && pnpm --filter @fruitback/extension zip:firefox

      - name: Keep the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-archives
          path: apps/extension/.output/*.zip
          # wxt writes under .output, and the action counts a file under a dot directory as hidden
          # and leaves it out. Without this line the first tag built both archives and uploaded none.
          include-hidden-files: true
          # A run that uploads nothing is a run that built nothing, and it would pass in silence.
          if-no-files-found: error

  # The captures of the guide, taken again on the tagged commit (FRU-486). `pnpm guide:captures`
  # writes only the captures that changed; when one did, a pull request « docs: the guide of <tag> »
  # carries them, and when none did, nothing is opened. The release does not wait for this job.
  #
  # On a Mac of GitHub, not the `sakuga-mac` pool: this repository is public, and the self-hosted
  # runners serve the private repositories only (see `sakuga-review.yml`). The fonts are those of
  # macOS. A run that is not from a tag `v*` takes the captures and keeps what changed as an
  # artifact, and opens nothing: that is the release of test.
  #
  # The job's own token only reads. The branch and the pull request are written with a token of the
  # App, so that `ci.yml` runs on that pull request: GitHub starts no workflow for an event made with
  # the token of a run.
  guide:
    name: captures of the guide
    needs: [ci]
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, as in `package`: what this job writes goes to a pull request of the repository.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full Chromium: the headless shell loads no extension (`e2e/extension.ts`).
      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Take the captures of the guide
        run: pnpm guide:captures

      - name: List the captures that changed
        id: changed
        run: |
          set -euo pipefail
          git add --intent-to-add docs/assets/guide apps/console/public/guide
          files=$(git diff --name-only -- docs/assets/guide apps/console/public/guide apps/console/app/guide-captured.ts docs/reviewing.md)
          if [ -z "$files" ]; then
            echo "No capture of the guide changed."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "$files"
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the captures that changed
        if: steps.changed.outputs.any == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-captures
          path: docs/assets/guide/
          if-no-files-found: error

      - name: Token of the App
        if: steps.changed.outputs.any == 'true' && startsWith(github.ref, 'refs/tags/v')
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The Client ID of the App: not a secret.
          client-id: Iv23liesB1xzywavcnv2
          private-key: ${{ secrets.PR_AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open the pull request of the captures
        if: steps.changed.outputs.any == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APP: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          branch="guide/$TAG"
          id=$(gh api "/users/${APP}%5Bbot%5D" --jq .id)
          git switch -c "$branch"
          git add docs/assets/guide apps/console/public/guide apps/console/app/guide-captured.ts docs/reviewing.md
          git -c user.name="${APP}[bot]" -c user.email="${id}+${APP}[bot]@users.noreply.github.com" \
            commit -m "docs: the guide of $TAG (FRU-486)" -m "Taken by pnpm guide:captures on the tag, in release-extension.yml."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "docs: the guide of $TAG" \
            --body "The captures of the guide that changed with the extension $TAG, taken by \`pnpm guide:captures\` on the tag (release-extension.yml, FRU-486). Check each capture against the screen it shows before the merge."

  publish:
    name: attach to the release
    needs: [ci, package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only permission to write in this workflow, on the only job that needs one.
    permissions:
      contents: write

    steps:
      - name: Take the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-archives
          path: archives

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so `gh` has no repository to infer from its working
          # directory. Without this the first tag fails at the upload. Raised in review.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A published release starts this run, and it exists. A run started by hand on a tag has none.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" archives/*.zip --clobber
          else
            gh release create "$TAG" --generate-notes --verify-tag archives/*.zip
          fi

  # Hands the archives of `package` to the Chrome Web Store and to AMO (FRU-329). It writes nothing to
  # GitHub, but it holds the keys of the stores. The environment `stores` gives them to the job only
  # after a person approves the run. WARNING: a run that does not come from a tag `v*` only checks the
  # keys (`--dry-run`): it uploads nothing and submits nothing.
  submit:
    name: submit to the stores
    needs: [ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stores

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache, as in `package`: this job sends what it runs to a store, with the keys of the store.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # `wxt submit` is `publish-browser-extension`, at the version of the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Take the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-archives
          path: archives

      - name: Submit the archives
        env:
          FROM_A_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ vars.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          # The review of Google passes, and the version waits for a press of « Publish » in the
          # dashboard. The variable `CHROME_PUBLISH_TYPE` = `DEFAULT_PUBLISH` publishes at once.
          CHROME_PUBLISH_TYPE: ${{ vars.CHROME_PUBLISH_TYPE || 'STAGED_PUBLISH' }}
          # The `gecko.id` of `apps/extension/wxt.config.ts`.
          FIREFOX_EXTENSION_ID: fruitback@sakuga-software.com
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ vars.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: |
          set -euo pipefail
          one() {
            local found=("$GITHUB_WORKSPACE"/archives/*-"$1".zip)
            if [ "${#found[@]}" -eq 1 ] && [ -f "${found[0]}" ]; then
              echo "${found[0]}"
              return
            fi
            echo "expected one archive *-$1.zip, found: ${found[*]}" >&2
            exit 1
          }
          # A store with no keys is left out on a check, and fails a tag: a tag that reached one store
          # and not the other would pass in silence.
          missing() {
            if [ "$FROM_A_TAG" = true ]; then
              echo "$1 has no keys in the environment stores" >&2
              exit 1
            fi
            echo "::warning::$1 has no keys in the environment stores: it is left out"
          }
          args=()
          if [ -n "$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY" ] && [ -n "$CHROME_EXTENSION_ID" ]; then
            chrome=$(one chrome)
            args+=(--chrome-zip "$chrome")
          else
            missing "the Chrome Web Store"
          fi
          if [ -n "$FIREFOX_JWT_SECRET" ] && [ -n "$FIREFOX_JWT_ISSUER" ]; then
            firefox=$(one firefox)
            sources=$(one sources)
            args+=(--firefox-zip "$firefox" --firefox-sources-zip "$sources")
          else
            missing "AMO"
          fi
          if [ "${#args[@]}" -eq 0 ]; then
            echo "no store has keys in the environment stores" >&2
            exit 1
          fi
          if [ "$FROM_A_TAG" != true ]; then
            args+=(--dry-run)
          fi
          pnpm --filter @fruitback/extension exec wxt submit "${args[@]}"
