name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One job per Nx target, so a red check names what broke without opening the logs.
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format, typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx run-many -t ${{ matrix.target }}

  e2e:
    # The two things `node --test` cannot answer for: a real selector engine and real layout. Kept to
    # six specs and ~6 seconds of browser time — a slow E2E job is one people learn to ignore.
    name: e2e
    runs-on: ubuntu-latest
    # The suite itself runs in seconds; the only thing here that can take minutes is fetching the
    # browser. A cap turns a stalled download into a red check in ten minutes instead of a runner
    # burning twenty — which is exactly how this job first failed.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache the browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed on the pinned version: a bump downloads once, then hits the cache.
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install the browser
        # Only Chromium, and only its headless shell: the suite tests our DOM code, not
        # cross-browser behaviour, and CI never runs headed. That is half the download.
        # Skipped entirely on a cache hit — the first run of this job stalled for eighteen minutes
        # after fetching 167 MB, so the less it fetches, the less there is to stall on.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium

      - name: Install the system libraries the browser needs
        # Cheap (apt, ~15s) and needed even when the browser itself came from the cache.
        run: pnpm exec playwright install-deps chromium

      - name: Run the E2E suite
        # No LINEAR_API_KEY anywhere: the worker runs on its in-memory Linear (FRUITBACK_FAKE_LINEAR).
        run: pnpm e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    # Dokploy builds this same Dockerfile on push, so a broken one must fail here first.
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: fruitback-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check readiness
        run: |
          docker run -d --name worker -p 8080:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "the container never became ready:"
          docker logs worker
          exit 1
