name: CI

on:
  # Every pull request, whatever branch it targets (FRU-172). With `branches: [main]` here, a pull
  # request stacked on another one got no check at all, and that looks the same as checks that have
  # not started. `workflows.test.ts` fails on a filter of branches or of paths.
  pull_request:
  push:
    branches: [main]
  # A merge queue runs the checks on the commit it is about to put on `main`. Nothing sends this
  # event until the repository has a queue, and a queue with no run to wait for never merges.
  merge_group:
  # The workflows that publish call this one, and publish only after it passed (FRU-172).
  workflow_call:

permissions:
  contents: read

# A push to a pull request makes the run of the push before it obsolete, so that run is cancelled.
# A commit of `main` is never obsolete: it takes a group of its own, so no later merge cancels its
# run or takes its place in a queue. On 2026-10-11 two merges landed 14 seconds apart, the run of
# the first one was cancelled, and `main` had no verdict for that commit.
#
# The name of the workflow is in the group. In a call it is the name of the caller, so the run that
# a release starts and the run of `CI` on the same commit do not wait for each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # One job per Nx target, so a red check names what broke without opening the logs.
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format, typecheck, test]
    env:
      # FRU-180. The commit that `postgres-journal.test.ts` compares the migrations with: a migration
      # that the base has must be here, first, and unchanged. For a pull request the checkout is the
      # merge commit, and its first parent is the head of the base. On `main` it is the commit before.
      FRUITBACK_MIGRATIONS_BASE: HEAD^1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job reaches the remote after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false
          # The commit, and its parents: `HEAD^1` above is read with `git show`.
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx run-many -t ${{ matrix.target }}

      # A test that reads the locale of the shell passes on this runner and fails on the machine of
      # somebody who works in French, or the reverse (FRU-172). Node takes the language of its own
      # `navigator`, and the default of `Intl`, from these variables. `--skip-nx-cache` is what makes
      # this a second run: the locale is no input of the `test` target, so Nx would replay the first.
      - name: Run the tests again under a French locale
        if: matrix.target == 'test'
        env:
          LC_ALL: fr_FR.UTF-8
          LANG: fr_FR.UTF-8
        run: |
          test "$(node -p 'navigator.language')" = fr-FR
          pnpm exec nx run-many -t test --skip-nx-cache

  e2e:
    # The two things `node --test` cannot answer for: a real selector engine and real layout. Kept to
    # six specs and ~6 seconds of browser time — a slow E2E job is one people learn to ignore.
    name: e2e
    runs-on: ubuntu-latest
    # The browser comes with the image instead of being downloaded. Twice in a row, `playwright
    # install` reached 100% of the archive and then sat there until it was killed — eighteen minutes,
    # then ten — with nothing after the progress bar. Whatever that is, it is not something this repo
    # can fix, and the official image removes the whole step: no cdn.playwright.dev, no apt, no
    # browser cache to key. The tag is the version, so image and `@playwright/test` cannot drift.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      # The runner's workspace belongs to uid 1001; as root, the actions trip over their own files.
      options: --user 1001
    # Node still comes from `.nvmrc` and not from the image: the sources run untranspiled, which
    # needs a newer Node than noble ships.
    # The suite grew to about 200 tests on one worker: 6 to 9 minutes on 2026-10-13, and runs that
    # passed every test were stopped at ten. The ceiling still stops a browser that hangs.
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the E2E suite
        # No key and no service: each worker of the suite has a PostgreSQL in its process (PGlite,
        # `dev-worker.fixture.ts`, FRU-223).
        run: pnpm e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  postgres:
    # FRU-141, FRU-142. The accounts and the sessions in PostgreSQL, against a real server. `test` runs
    # the same cases on PGlite,
    # which is a PostgreSQL in the process with one connection: no race can show there. Here the calls
    # of a case run on several connections, and two processes migrate one empty database together.
    # `test:postgres` fails when the address is missing: a suite that is skipped proves nothing.
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # A database that lives for this job, on the runner's own network: not a secret.
          POSTGRES_PASSWORD: ci-not-a-real-password
          POSTGRES_DB: fruitback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the account and session stores on a real PostgreSQL
        env:
          FRUITBACK_TEST_DATABASE_URL: postgres://postgres:ci-not-a-real-password@127.0.0.1:5432/fruitback
        run: pnpm --filter @fruitback/worker test:postgres

  dependencies:
    # FRU-143. The scan of the image reads the packages that a file of the image names. The worker is
    # one bundle: `pg` and its packages are inside server.mjs, and no file names them. So the lockfile
    # is asked. `--prod`: the dependencies of what runs, and not the tools. The job fails on any
    # advisory the registry knows, and when the registry does not answer: a check that is skipped
    # proves nothing. It does not see a devDependency that a build compiles into what ships: image.md.
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Ask the registry for the advisories of the production dependencies
        # The lockfile is enough: nothing is installed.
        run: pnpm audit --prod

  image:
    # Dokploy builds this same Dockerfile on push, so a broken one must fail here first.
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: fruitback-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check readiness
        run: |
          docker run -d --name worker -p 8080:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "the container never became ready:"
          docker logs worker
          exit 1

      - name: Boot it with the switch of the database of development, and find it refused
        # FRU-223. `pnpm dev` and the E2E suite run on a PostgreSQL in the process, behind
        # FRUITBACK_DEV_DATABASE. The image must refuse the switch, and never ignore it: a worker
        # that ignored it would start with no database, or on another one than its operator thinks.
        # Matched on the 503 and on the name of the variable, as for FRUITBACK_STORE=memory in
        # release-image.yml. The second half checks what makes the refusal true whatever the code
        # says: the image holds neither the file that makes that database nor PGlite.
        run: |
          docker run -d --name dev-database -p 8084:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e FRUITBACK_STORE=postgres \
            -e FRUITBACK_DEV_DATABASE=pglite \
            -e FRUITBACK_IDENTITY_SECRET=ci-not-a-real-secret-of-32-characters \
            -e FRUITBACK_CONSOLE_URL=https://app.fruitback.example \
            fruitback-worker:ci
          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /tmp/dev-database-body -w '%{http_code}' http://127.0.0.1:8084/health || true)
            if [ "$code" != "000" ]; then break; fi
            sleep 1
          done
          body=$(cat /tmp/dev-database-body)
          case "$code:$body" in
            503:*FRUITBACK_DEV_DATABASE*) echo "refused as it should: $body" ;;
            *)
              echo "the image did not refuse FRUITBACK_DEV_DATABASE (HTTP $code, body: $body)"
              docker logs dev-database
              exit 1
              ;;
          esac
          if docker exec dev-database sh -c 'ls -R / 2>/dev/null | grep -i -E "pglite|dev-worker"'; then
            echo "the image holds PGlite or the worker of development"
            exit 1
          fi
          docker rm -f dev-database

      - name: Boot it with its accounts in PostgreSQL, and read the sites from the database
        # FRU-141. The driver of PostgreSQL is CommonJS inside an ESM bundle: without the banner of the
        # build script, the first query fails with « Dynamic require ». /health never opens the
        # database, so the probe that proves the bundle is a read: the worker applies its migrations,
        # reads no site, and answers that it knows no such client. A bundle that cannot reach the
        # database answers 502 there.
        #
        # FRU-142. The sessions are in that database too, so the worker gets no session file: it
        # refuses one beside the database. `pair` is the command of the bundle that writes there, and
        # it must end: `docker exec` waits for it.
        run: |
          docker network create accounts
          docker run -d --name accounts-db --network accounts \
            -e POSTGRES_PASSWORD=ci-not-a-real-password \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          for attempt in $(seq 1 30); do
            if docker exec accounts-db pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          docker run -d --name worker-db --network accounts -p 8083:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            -e FRUITBACK_IDENTITY_SECRET=ci-not-a-real-secret-of-32-characters \
            -e FRUITBACK_CONSOLE_URL=https://app.fruitback.example \
            -e FRUITBACK_DATABASE_URL=postgres://postgres:ci-not-a-real-password@accounts-db:5432/postgres \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8083/health; then break; fi
            sleep 1
          done
          answer=$(curl -s -H 'Origin: http://localhost:5173' \
            'http://127.0.0.1:8083/feedback?url=http%3A%2F%2Flocalhost%3A5173%2F&client=site_nobody')
          echo "$answer"
          docker logs worker-db
          test "$answer" = '{"error":"unknown-client"}'
          # FRU-180. The migrations are files beside the bundle, and Drizzle writes one row for each one
          # it applied: an image without its `drizzle` folder answers 502 above, and has no row here.
          test "$(docker exec accounts-db psql -U postgres -Atc 'SELECT count(*) FROM public.__drizzle_migrations')" = "$(jq '.entries | length' apps/worker/drizzle/meta/_journal.json)"
          # FRU-146. The accounts are in the tables of better-auth, and the table of before is gone.
          test "$(docker exec accounts-db psql -U postgres -Atc "SELECT to_regclass('public.user') IS NOT NULL AND to_regclass('public.accounts') IS NULL")" = t
          timeout 30 docker exec worker-db node server.mjs pair --subject ci
          test "$(docker exec accounts-db psql -U postgres -Atc 'SELECT count(*) FROM pairings')" = 1
          docker rm -f worker-db accounts-db

      - name: Boot it with better-auth on, and find it built and serving no route
        # FRU-144. better-auth is in the bundle behind a dynamic import, and no route reads it, so
        # /health is green on a bundle that cannot load it. With its secret and a database the worker
        # builds it at boot and says so in its log: that line is what proves the bundle. The same
        # image without the secret must say nothing of it. FRU-147: the one with the secret serves /ok, and
        # answers 404 on a route it does not serve (/get-session since FRU-206, and a route of the
        # organization plugin); the other answers 404 on all three.
        run: |
          docker network create auth
          docker run -d --name auth-db --network auth \
            -e POSTGRES_PASSWORD=ci-not-a-real-password \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          for attempt in $(seq 1 30); do
            if docker exec auth-db pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          start() {
            name=$1
            port=$2
            shift 2
            docker run -d --name "$name" --network auth -p "$port:8080" \
              -e ALLOWED_ORIGINS=http://localhost:5173 \
              -e LINEAR_API_KEY=ci-not-a-real-key \
              -e LINEAR_TEAM_ID=ci-team \
              -e FRUITBACK_IDENTITY_SECRET=ci-not-a-real-secret-of-32-characters \
              -e FRUITBACK_CONSOLE_URL=https://app.fruitback.example \
              -e FRUITBACK_PUBLIC_URL=https://api.fruitback.example \
              -e FRUITBACK_DATABASE_URL=postgres://postgres:ci-not-a-real-password@auth-db:5432/postgres \
              "$@" fruitback-worker:ci
            for attempt in $(seq 1 30); do
              if curl -sf -o /dev/null "http://127.0.0.1:$port/health"; then break; fi
              sleep 1
            done
          }
          start worker-auth-off 8084
          start worker-auth-on 8085 -e FRUITBACK_AUTH_SECRET=ci-not-a-real-secret-of-better-auth-0123456789
          for attempt in $(seq 1 30); do
            if docker logs worker-auth-on 2>&1 | grep -q 'better-auth is ready, under /console/auth'; then break; fi
            sleep 1
          done
          docker logs worker-auth-on
          docker logs worker-auth-off
          docker logs worker-auth-on 2>&1 | grep -q 'better-auth is ready, under /console/auth'
          for port in 8084 8085; do
            for route in ok get-session organization/list; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://app.fruitback.example' \
                "http://127.0.0.1:$port/console/auth/$route")
              echo "$port /console/auth/$route $status"
              expected=404
              if [ "$port" = 8085 ] && [ "$route" = ok ]; then expected=200; fi
              test "$status" = "$expected"
            done
          done
          # After the requests above: a line of better-auth in the log of the worker that has it off
          # would say that something loaded it.
          if docker logs worker-auth-off 2>&1 | grep -q 'better-auth'; then
            echo "the worker without FRUITBACK_AUTH_SECRET said something of better-auth"
            exit 1
          fi
          # FRU-180. The seven tables of better-auth are in the migrations of Drizzle, and the journal has
          # one row for each entry of the folder.
          test "$(docker exec auth-db psql -U postgres -Atc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND tablename IN ('user', 'session', 'account', 'verification', 'organization', 'member', 'invitation')")" = 7
          test "$(docker exec auth-db psql -U postgres -Atc 'SELECT count(*) FROM public.__drizzle_migrations')" = "$(jq '.entries | length' apps/worker/drizzle/meta/_journal.json)"
          docker rm -f worker-auth-on worker-auth-off auth-db

      - name: Take a snapshot of the database, restore it on another server, and count the rows
        # FRU-143. The backup of the Cloud is the dump that snapshot-pg.sh takes, and a backup that
        # nobody restored is a hope. The script fills every table, takes the snapshot, restores it
        # with the commands of the runbook, compares each table of the two databases, and checks that
        # a dump that lost its end replaces nothing.
        env:
          WORKER_IMAGE: fruitback-worker:ci
        run: sh apps/worker/cloud/restore-drill.sh

      - name: Build the image of the public demonstration
        # FRU-79. Dokploy builds this Dockerfile on push too. It is not published anywhere.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/playground/Dockerfile
          push: false
          load: true
          tags: fruitback-playground:ci
          cache-from: type=gha,scope=playground
          cache-to: type=gha,mode=max,scope=playground

      - name: Boot the demonstration, and check that it answers for its own host only
        run: |
          docker run -d --name playground -p 5177:5177 \
            -e PLAYGROUND_ALLOWED_HOSTS=demo.fruitback.com \
            fruitback-playground:ci
          for attempt in $(seq 1 90); do
            if curl -sf -o /dev/null -H 'Host: demo.fruitback.com' http://127.0.0.1:5177/; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: demo.fruitback.com' http://127.0.0.1:5177/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:5177/)" = 403
          docker rm -f playground

      - name: Build the image of the console
        # FRU-222. The image that is published: built with no address of a worker in it.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          load: true
          tags: fruitback-console:ci
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

      - name: Boot the console for two workers, and check what each serves
        # One image, any instance: the address of the worker is given when the container starts. Each
        # policy must name its own worker and allow the inline scripts by hash, never as unsafe-inline.
        run: |
          set -euo pipefail
          serve() {
            docker run -d --name "$1" -p "$2:80" -e "FRUITBACK_API=$3" fruitback-console:ci
            for attempt in $(seq 1 30); do
              if curl -sf -o /dev/null "http://127.0.0.1:$2/"; then return 0; fi
              sleep 1
            done
            docker logs "$1"
            return 1
          }
          serve console-acme 8082 https://api.acme.example
          # A slash at the end and a path: the page gets the address with no slash, the policy its origin.
          serve console-other 8083 https://other.example:8443/fruitback/

          policy() { curl -s -D - -o /dev/null "http://127.0.0.1:$1/w/any/sites" | tr -d '\r' | grep -i '^content-security-policy:'; }
          # WARNING: never `! grep`. Under `bash -e` a command that `!` inverts does not stop the script,
          # so the step stayed green with the very thing it looks for. `absent` exits by itself.
          absent() { if grep -q -- "$1" "$2"; then echo "found « $1 » in $2, where it must not be"; exit 1; fi; }
          policy 8082 | tee /tmp/acme
          policy 8083 | tee /tmp/other
          grep -q "connect-src 'self' https://api.acme.example;" /tmp/acme
          grep -q "connect-src 'self' https://other.example:8443;" /tmp/other
          absent "other.example" /tmp/acme
          absent "acme.example" /tmp/other
          for file in /tmp/acme /tmp/other; do
            grep -q "'sha256-" "$file"
            absent "script-src[^;]*unsafe-inline" "$file"
            grep -q "frame-ancestors 'none'" "$file"
          done
          test "$(curl -s http://127.0.0.1:8082/config.js)" = 'globalThis.__FRUITBACK__ = { api: "https://api.acme.example" };'
          test "$(curl -s http://127.0.0.1:8083/config.js)" = 'globalThis.__FRUITBACK__ = { api: "https://other.example:8443/fruitback" };'
          # The address is never kept by a browser, and the page loads it before its bundle.
          curl -s -D - -o /dev/null http://127.0.0.1:8082/config.js | tr -d '\r' | grep -qi '^cache-control: no-store$'
          curl -s http://127.0.0.1:8082/ | grep -q '<script src="/config.js"></script>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/fruitback.iife.js)" = 200
          # Not root, and nothing of the repository beside the built files.
          test "$(docker exec console-acme id -u)" = 101
          test -z "$(docker exec console-acme find / -xdev \( -name '*.ts' -o -name '*.tsx' -o -name '*.map' -o -name 'package.json' -o -name 'pnpm-lock.yaml' -o -name '.env*' -o -name node_modules \) 2>/dev/null)"
          test -z "$(docker exec console-acme find / -xdev -writable -not -path '/tmp*' -not -path '/proc/*' -not -path '/dev/*' 2>/dev/null)"
          docker rm -f console-acme console-other

          # As the compose file runs it: a read-only root, no capability, a port that needs no right.
          docker run -d --name console-locked -p 8082:8080 --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges -e FRUITBACK_CONSOLE_LISTEN=8080 \
            -e FRUITBACK_API=https://api.acme.example fruitback-console:ci
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8082/; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/sign-in)" = 200
          docker rm -f console-locked

      - name: Refuse to start a console with no worker, or with what is not an address
        # Exit 1 from the entry script, with its sentence, never 124 from a timeout: a container that
        # started would also fail. An address goes into a header and into a script, so what is not
        # one must stop the container before either is written.
        run: |
          set -euo pipefail
          refused() {
            code=0
            said=$(timeout 30 docker run --rm "$@" fruitback-console:ci 2>&1) || code=$?
            echo "$code: $said"
            test "$code" = 1 && echo "$said" | grep -q '^fruitback-console: FRUITBACK_API'
          }
          refused
          refused -e "FRUITBACK_API=https://a.example; script-src *"
          refused -e "FRUITBACK_API=https://a.example'"
          refused -e 'FRUITBACK_API=https://a.example"};alert(1);//'
          refused -e "FRUITBACK_API=https://user:pw@a.example"
          refused -e "FRUITBACK_API=https://a.example?next=1"
          refused -e "FRUITBACK_API=javascript:alert(1)"
          refused -e "FRUITBACK_API=$(printf 'https://a.example\nhttps://b.example')"

      - name: Build the console as the Cloud does, and check that it starts with no variable
        # FRU-99, kept by FRU-222. Dokploy builds this Dockerfile for app.fruitback.com with the
        # address as a build argument and gives the container no variable: that must still serve.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          load: true
          tags: fruitback-console:cloud
          build-args: VITE_FRUITBACK_API=https://api.fruitback.example
          cache-from: type=gha,scope=console

      - name: Boot the console of the Cloud
        run: |
          set -euo pipefail
          docker run -d --name console-cloud -p 8082:80 fruitback-console:cloud
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8082/; then break; fi
            sleep 1
          done
          curl -s -D - -o /dev/null http://127.0.0.1:8082/w/any/sites | tr -d '\r' | grep -i '^content-security-policy:' | tee /tmp/cloud
          grep -q "connect-src 'self' https://api.fruitback.example;" /tmp/cloud
          test "$(curl -s http://127.0.0.1:8082/config.js)" = 'globalThis.__FRUITBACK__ = { api: "https://api.fruitback.example" };'
          docker rm -f console-cloud

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: From docker-compose.yml alone to a planted pin
        # FRU-48. The directory holds only the compose file and a .env copied from .env.example, like
        # the machine of somebody who never cloned this repository. The compose file pulls the
        # published image. The tag below puts the image of this commit in the local daemon under that
        # exact name, so compose finds it, pulls nothing, and needs no registry login.
        # FRUITBACK_IMAGE is set here so that the tag and the reference cannot differ. The container of
        # the step above still holds port 8080, so this run must use another port.
        env:
          FRUITBACK_IMAGE: ghcr.io/sakuga-software/fruitback-worker:edge
          FRUITBACK_PORT: '8081'
        run: |
          docker tag fruitback-worker:ci "$FRUITBACK_IMAGE"
          mkdir -p "$RUNNER_TEMP/compose"
          cp docker-compose.yml "$RUNNER_TEMP/compose/"
          cp .env.example "$RUNNER_TEMP/compose/.env"
          cd "$RUNNER_TEMP/compose"
          docker compose up -d --wait
          node "$GITHUB_WORKSPACE/apps/worker/src/plant-a-pin.ts" "http://127.0.0.1:$FRUITBACK_PORT"
          # Recreated, not restarted: the pin must outlive the container, so it must be on the volume.
          docker compose up -d --wait --force-recreate
          node "$GITHUB_WORKSPACE/apps/worker/src/plant-a-pin.ts" "http://127.0.0.1:$FRUITBACK_PORT" --read

      - name: The console of docker-compose.yml, in the same directory
        # FRU-222. The `console` profile, with the image of this commit under the name the file pulls.
        # The worker of the step above keeps running: only the console is started here.
        env:
          FRUITBACK_IMAGE: ghcr.io/sakuga-software/fruitback-worker:edge
          FRUITBACK_PORT: '8081'
          FRUITBACK_CONSOLE_IMAGE: ghcr.io/sakuga-software/fruitback-console:edge
          FRUITBACK_CONSOLE_PORT: '8084'
        run: |
          set -euo pipefail
          docker tag fruitback-console:ci "$FRUITBACK_CONSOLE_IMAGE"
          cd "$RUNNER_TEMP/compose"
          # The `.env` of the example names no address of the worker: the console stops, and says why.
          if docker compose --profile console up -d --wait --wait-timeout 60 console; then
            echo "the console started with no address of a worker"
            exit 1
          fi
          docker compose --profile console logs --no-color console | grep -q 'FRUITBACK_API is not set'
          docker compose --profile console rm -fsv console
          FRUITBACK_PUBLIC_URL=http://127.0.0.1:8081 docker compose --profile console up -d --wait --wait-timeout 60 console
          curl -s -D - -o /dev/null http://127.0.0.1:8084/sign-in | tr -d '\r' | grep -i '^content-security-policy:' | tee /tmp/composed
          grep -q "connect-src 'self' http://127.0.0.1:8081;" /tmp/composed
          test "$(docker compose --profile console exec -T console id -u)" = 101

      - name: Worker logs, if the compose run failed
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/compose" logs --no-color || true

  zizmor:
    # The workflows hold the token that publishes the image, so they are audited like code (FRU-70).
    # Offline: the audits that call the GitHub API do not run, so the result depends on the files alone.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action pulls the zizmor image by the digest it lists for this exact version.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows
          online-audits: false
          # The action passes `token` to zizmor, and it defaults to the job's GITHUB_TOKEN. The audits
          # here are offline, so no token is needed. An empty value is refused ("GitHub token cannot be
          # empty"), so this placeholder is what keeps the real token out of the audit container.
          token: unused-offline
          advanced-security: false
          annotations: true
