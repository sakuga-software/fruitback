name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One job per Nx target, so a red check names what broke without opening the logs.
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format, typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx run-many -t ${{ matrix.target }}

  e2e:
    # The two things `node --test` cannot answer for: a real selector engine and real layout. Kept to
    # six specs and ~6 seconds of browser time — a slow E2E job is one people learn to ignore.
    name: e2e
    runs-on: ubuntu-latest
    # The browser comes with the image instead of being downloaded. Twice in a row, `playwright
    # install` reached 100% of the archive and then sat there until it was killed — eighteen minutes,
    # then ten — with nothing after the progress bar. Whatever that is, it is not something this repo
    # can fix, and the official image removes the whole step: no cdn.playwright.dev, no apt, no
    # browser cache to key. The tag is the version, so image and `@playwright/test` cannot drift.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      # The runner's workspace belongs to uid 1001; as root, the actions trip over their own files.
      options: --user 1001
    # Node still comes from `.nvmrc` and not from the image: the sources run untranspiled, which
    # needs a newer Node than noble ships.
    # The suite takes six seconds. If this job ever approaches ten minutes, something is wrong again.
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the E2E suite
        # No LINEAR_API_KEY anywhere: the worker runs on its in-memory store (FRUITBACK_STORE=memory).
        run: pnpm e2e

      - name: Keep the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  postgres:
    # FRU-141. The accounts in PostgreSQL, against a real server. `test` runs the same cases on PGlite,
    # which is a PostgreSQL in the process with one connection: no race can show there. Here the calls
    # of a case run on several connections, and two processes migrate one empty database together.
    # `test:postgres` fails when the address is missing: a suite that is skipped proves nothing.
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          # A database that lives for this job, on the runner's own network: not a secret.
          POSTGRES_PASSWORD: ci-not-a-real-password
          POSTGRES_DB: fruitback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the account store on a real PostgreSQL
        env:
          FRUITBACK_TEST_DATABASE_URL: postgres://postgres:ci-not-a-real-password@127.0.0.1:5432/fruitback
        run: pnpm --filter @fruitback/worker test:postgres

  image:
    # Dokploy builds this same Dockerfile on push, so a broken one must fail here first.
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: fruitback-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check readiness
        run: |
          docker run -d --name worker -p 8080:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "the container never became ready:"
          docker logs worker
          exit 1

      - name: Boot it with its accounts in PostgreSQL, and read the sites from the database
        # FRU-141. The driver of PostgreSQL is CommonJS inside an ESM bundle: without the banner of the
        # build script, the first query fails with « Dynamic require ». /health never opens the
        # database, so the probe that proves the bundle is a read: the worker applies its migrations,
        # reads no site, and answers that it knows no such client. A bundle that cannot reach the
        # database answers 502 there.
        run: |
          docker network create accounts
          docker run -d --name accounts-db --network accounts \
            -e POSTGRES_PASSWORD=ci-not-a-real-password \
            postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          for attempt in $(seq 1 30); do
            if docker exec accounts-db pg_isready -U postgres -q; then break; fi
            sleep 1
          done
          docker run -d --name worker-db --network accounts -p 8083:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            -e FRUITBACK_IDENTITY_SECRET=ci-not-a-real-secret-of-32-characters \
            -e FRUITBACK_SESSION_PATH=/data/sessions.db \
            -e FRUITBACK_CONSOLE_URL=https://app.fruitback.example \
            -e FRUITBACK_DATABASE_URL=postgres://postgres:ci-not-a-real-password@accounts-db:5432/postgres \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8083/health; then break; fi
            sleep 1
          done
          answer=$(curl -s -H 'Origin: http://localhost:5173' \
            'http://127.0.0.1:8083/feedback?url=http%3A%2F%2Flocalhost%3A5173%2F&client=site_nobody')
          echo "$answer"
          docker logs worker-db
          test "$answer" = '{"error":"unknown-client"}'
          test "$(docker exec accounts-db psql -U postgres -Atc 'SELECT name FROM schema_migrations ORDER BY version' | head -1)" = accounts
          docker rm -f worker-db accounts-db

      - name: Build the image of the public demonstration
        # FRU-79. Dokploy builds this Dockerfile on push too. It is not published anywhere.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/playground/Dockerfile
          push: false
          load: true
          tags: fruitback-playground:ci
          cache-from: type=gha,scope=playground
          cache-to: type=gha,mode=max,scope=playground

      - name: Boot the demonstration, and check that it answers for its own host only
        run: |
          docker run -d --name playground -p 5177:5177 \
            -e PLAYGROUND_ALLOWED_HOSTS=demo.fruitback.com \
            fruitback-playground:ci
          for attempt in $(seq 1 90); do
            if curl -sf -o /dev/null -H 'Host: demo.fruitback.com' http://127.0.0.1:5177/; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: demo.fruitback.com' http://127.0.0.1:5177/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:5177/)" = 403
          docker rm -f playground

      - name: Build the image of the console
        # FRU-99. Dokploy builds this Dockerfile too, for app.fruitback.com.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/console/Dockerfile
          push: false
          load: true
          tags: fruitback-console:ci
          build-args: VITE_FRUITBACK_API=https://api.fruitback.example
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

      - name: Boot the console, and check what it serves
        # The policy must name the worker and allow the inline scripts by hash, never as unsafe-inline.
        run: |
          # No FRUITBACK_API: it defaults to the address the bundle was built with.
          docker run -d --name console -p 8082:80 fruitback-console:ci
          for attempt in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8082/; then break; fi
            sleep 1
          done
          policy=$(curl -s -D - -o /dev/null http://127.0.0.1:8082/w/any/sites | grep -i '^content-security-policy:')
          echo "$policy"
          echo "$policy" | grep -q "connect-src 'self' https://api.fruitback.example"
          echo "$policy" | grep -q "'sha256-"
          ! echo "$policy" | grep -q "script-src[^;]*unsafe-inline"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/fruitback.iife.js)" = 200
          docker rm -f console
          # Another address at run time would block every call of the bundle, so the container stops.
          # Exit 1 from the check, never 124 from a timeout: a container that started would also fail.
          code=0
          timeout 30 docker run --rm -e FRUITBACK_API=https://other.example fruitback-console:ci || code=$?
          test "$code" = 1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: From docker-compose.yml alone to a planted pin
        # FRU-48. The directory holds only the compose file and a .env copied from .env.example, like
        # the machine of somebody who never cloned this repository. The compose file pulls the
        # published image. The tag below puts the image of this commit in the local daemon under that
        # exact name, so compose finds it, pulls nothing, and needs no registry login.
        # FRUITBACK_IMAGE is set here so that the tag and the reference cannot differ. The container of
        # the step above still holds port 8080, so this run must use another port.
        env:
          FRUITBACK_IMAGE: ghcr.io/sakuga-software/fruitback-worker:edge
          FRUITBACK_PORT: '8081'
        run: |
          docker tag fruitback-worker:ci "$FRUITBACK_IMAGE"
          mkdir -p "$RUNNER_TEMP/compose"
          cp docker-compose.yml "$RUNNER_TEMP/compose/"
          cp .env.example "$RUNNER_TEMP/compose/.env"
          cd "$RUNNER_TEMP/compose"
          docker compose up -d --wait
          node "$GITHUB_WORKSPACE/apps/worker/src/plant-a-pin.ts" "http://127.0.0.1:$FRUITBACK_PORT"
          # Recreated, not restarted: the pin must outlive the container, so it must be on the volume.
          docker compose up -d --wait --force-recreate
          node "$GITHUB_WORKSPACE/apps/worker/src/plant-a-pin.ts" "http://127.0.0.1:$FRUITBACK_PORT" --read

      - name: Worker logs, if the compose run failed
        if: failure()
        run: docker compose --project-directory "$RUNNER_TEMP/compose" logs --no-color || true

  zizmor:
    # The workflows hold the token that publishes the image, so they are audited like code (FRU-70).
    # Offline: the audits that call the GitHub API do not run, so the result depends on the files alone.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action pulls the zizmor image by the digest it lists for this exact version.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          inputs: .github/workflows
          online-audits: false
          # The action passes `token` to zizmor, and it defaults to the job's GITHUB_TOKEN. The audits
          # here are offline, so no token is needed. An empty value is refused ("GitHub token cannot be
          # empty"), so this placeholder is what keeps the real token out of the audit container.
          token: unused-offline
          advanced-security: false
          annotations: true
