name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # One job per Nx target, so a red check names what broke without opening the logs.
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [lint, format, typecheck, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.target }}
        run: pnpm exec nx run-many -t ${{ matrix.target }}

  image:
    # Dokploy builds this same Dockerfile on push, so a broken one must fail here first.
    name: docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          load: true
          tags: fruitback-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot it and check readiness
        run: |
          docker run -d --name worker -p 8080:8080 \
            -e ALLOWED_ORIGINS=http://localhost:5173 \
            -e LINEAR_API_KEY=ci-not-a-real-key \
            -e LINEAR_TEAM_ID=ci-team \
            fruitback-worker:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health; then exit 0; fi
            sleep 1
          done
          echo "the container never became ready:"
          docker logs worker
          exit 1
