name: Release npm

# The five packages of `packages/*` go to npm from the tag of a release (FRU-28), with a provenance
# attestation that ties each tarball to the commit and the run that built it. The same `v*` tag also
# starts `release-extension.yml` and `release-image.yml`: one version for everything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only for every job. Only `publish` asks for more, and only for an OIDC token.
permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The checks of ci.yml on the tagged commit (FRU-172), as in the two other releases.
  ci:
    name: ci
    uses: $/.github/workflows/ci.yml
    # The job `docker image` of ci.yml reads the cache of its layers in the registry (FRU-344). A
    # called workflow gets no permission that its caller does not give, and the run does not start.
    permissions:
      contents: read
      packages: read

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here runs git after the checkout, so the token has no reason to stay in .git/config.
          persist-credentials: false

      # **Nothing is restored from a cache here**, as in `release-extension.yml`: what this job builds
      # goes to npm, and a cache is writable by any run of this repository.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npm refuses a version it already has, and keeps a number that was published once for ever. A
      # tag that names another version than the packages would publish a number nobody chose.
      - name: The tag and the five packages name the same version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for directory in shared widget element react fruitback; do
            declared=$(node -p "require('./packages/$directory/package.json').version")
            if [ "$TAG" != "v$declared" ]; then
              echo "the tag is $TAG and packages/$directory/package.json says $declared" >&2
              exit 1
            fi
          done

      # `prepack` builds each package, but the widget bundles the build of `shared`: build it first.
      - name: Build the contract and the widget
        run: pnpm --filter @fruitback/shared build && pnpm --filter @fruitback/widget build

      # pnpm, not npm: it writes the version of each `workspace:*` dependency into the tarball.
      - name: Pack the five packages
        run: pnpm --recursive --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/tarballs"

      - name: Keep the tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Sends the tarballs of `package` to npm. The environment `npm` gives the job its token only after a
  # person approves the run. WARNING: a run that does not come from a tag only packs and checks
  # (`--dry-run`): it publishes nothing.
  publish:
    name: publish to npm
    needs: [ci, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing: npm trusts the OIDC token of this run, so no npm token is kept
      # anywhere. The same token signs the provenance of each package.
      id-token: write

    steps:
      # No checkout and no install: this job publishes the tarballs that `package` built, with the npm
      # of the Node of the runner. Trusted publishing needs npm 11.5.1 or later.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Take the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarballs
          path: tarballs

      # Trusted publishing needs npm 11.5.1 or later. A Node of the runner could bring an older one.
      - name: The npm of the runner can publish with OIDC
        run: |
          set -euo pipefail
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::Trusted publishing needs npm 11.5.1 or later, and npm is $(npm --version)."; exit 1; }

      # In the order of their dependencies, so a package never names one that npm does not have yet.
      # A version that npm already has is skipped: a run that failed in the middle can run again.
      # WARNING: npm accepts the OIDC token of this run only for a package whose trusted publisher is
      # `release-npm.yml` of this repository, in the environment `npm`. See `packaging.md`.
      - name: Publish the tarballs
        env:
          FROM_A_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          for prefix in fruitback-shared fruitback-widget fruitback-element fruitback-react fruitback; do
            # `./` first: npm reads `tarballs/x.tgz` as the GitHub repository `tarballs/x.tgz` and asks git
            # for it. The run of v0.3.0 failed on that, before it published anything.
            tarball=$(find ./tarballs -maxdepth 1 -name "$prefix-[0-9]*.tgz" | head -n 1)
            if [ -z "$tarball" ]; then
              echo "no tarball for $prefix" >&2
              exit 1
            fi
            name=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            version=$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
            if [ "$FROM_A_TAG" != true ]; then
              npm publish "$tarball" --access public --dry-run
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
