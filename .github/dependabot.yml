# Every `uses:` in .github/workflows is pinned to a commit SHA, with its version as a comment
# (FRU-69). A tag can move to other code, and a SHA cannot. Dependabot reads the comment, so it
# updates the SHA and the comment together. Without this file the pins would never move.
# Dependabot does not pin a new step: apps/worker/src/workflows.test.ts fails on a bare tag.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
  # open-pull-requests-limit 0 stops the version updates. The security updates still open, grouped in one pull request.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
