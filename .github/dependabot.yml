# Every `uses:` in .github/workflows is pinned to a commit SHA, with its version as a comment
# (SKG-608). A tag can move to other code, and a SHA cannot. Dependabot reads the comment, so it
# updates the SHA and the comment together. Without this file the pins would never move.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
