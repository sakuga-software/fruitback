# nginx for the console (FRU-222), as a user that is not root: no `user` line, and everything it
# writes is under /tmp. The server itself is written by entrypoint.sh when the container starts.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The version of nginx is nobody's business.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    # Compressed answers (FRU-492). Without this, nginx sends every file as it is: 1.34 MB of
    # script and style for the first screen, 7.6 s before the first paint on a throttled phone.
    # nginx compresses text/html always; the types below are the others it serves. Level 5: the
    # files are small, and a higher level saves little for more CPU. `gzip_vary` adds
    # `Vary: Accept-Encoding`, so a shared cache does not give the compressed copy to a client that
    # did not ask for it. `gzip_proxied any`: a request that came through a proxy is compressed too.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    include /tmp/fruitback/console.conf;
}
