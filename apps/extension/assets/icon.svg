<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Fruitback">
  <!--
    The widget's own pin, and the geometry is its own: `overlay.ts` draws a square with
    `border-radius: 50% 50% 50% 0` turned by -45deg, which is a circle plus the one corner that
    stayed sharp. Here the head is the circle of radius 48 at (64,54) and the tip is the corner, at
    the distance r√2 below the centre. The two straight edges are its tangents.

    The drawing fills the canvas: a mark that sits small in its box reads as a mistake at 16px.
  -->
  <path d="M 64 121.9 L 30.1 87.9 A 48 48 0 1 1 97.9 87.9 Z" fill="#e53935" />
  <circle cx="64" cy="54" r="17" fill="#fff" />
</svg>
