# The gallery of the extension (FRU-523): static files, as the user `nginx`, everything written under /tmp.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    server {
        listen 80;
        # A redirect keeps the scheme and the host of the request: the proxy in front speaks https.
        absolute_redirect off;
        root /usr/share/nginx/html;

        # The files of the build carry a hash in their name.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = / {
            return 302 /gallery/;
        }

        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ =404;
        }
    }
}
