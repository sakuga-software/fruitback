<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Acme — Pricing (playground Fruitback)</title>
    <style>
      /*
        The page under the widget. It is a fake client site, and it is hostile on purpose: three
        identical cards, a `useId`-style id, hashed CSS-module and emotion classes, a form, and
        enough height to force a scroll. Every one of those is a way to break an anchor.
      */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          16px/1.5 -apple-system,
          system-ui,
          sans-serif;
        color: #1c1917;
        background: #fafaf9;
      }
      header {
        padding: 24px 48px;
        border-bottom: 1px solid #e7e5e4;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      h1 {
        font-size: 28px;
        margin: 0;
      }
      main {
        padding: 48px;
        max-width: 1100px;
        margin: 0 auto;
      }
      h2 {
        font-size: 22px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        margin: 32px 0 64px;
        padding: 0;
        list-style: none;
      }
      .card {
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 24px;
      }
      .card h3 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      .price {
        font-size: 32px;
        font-weight: 700;
        margin: 8px 0 16px;
      }
      .add {
        background: #e53935;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 15px;
        cursor: pointer;
      }
      .spacer {
        height: 700px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #a8a29e;
      }
      form {
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
        padding: 24px;
        max-width: 420px;
      }
      label {
        display: block;
        font-size: 13px;
        color: #57534e;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 16px;
      }
      footer {
        padding: 48px;
        color: #78716c;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Acme</h1>
      <!-- A `useId` id and an emotion class: unique today, different after the next render. -->
      <button id=":r7:" class="css-1x9f7ab" aria-label="Ouvrir le menu">☰</button>
    </header>

    <main>
      <h2>Nos formules</h2>

      <ul class="cards">
        <li class="card" data-testid="card-espresso">
          <h3>Espresso</h3>
          <div class="price">9 €</div>
          <button class="add button_3f2a1b">Ajouter</button>
        </li>
        <li class="card" data-testid="card-latte">
          <h3>Latte</h3>
          <div class="price">19 €</div>
          <button class="add button_3f2a1b">Ajouter</button>
        </li>
        <li class="card" data-testid="card-mocha">
          <h3>Mocha</h3>
          <div class="price">29 €</div>
          <button class="add button_3f2a1b">Ajouter</button>
        </li>
      </ul>

      <div class="spacer">— beaucoup de contenu entre les deux —</div>

      <form onsubmit="return false;">
        <label for="email-field">Votre e-mail</label>
        <input id="email-field" name="email" placeholder="vous@exemple.fr" />
        <button id="checkout-cta" data-testid="checkout-cta" class="add" type="button">Commander</button>
      </form>
    </main>

    <footer>© Acme</footer>

    <script>
      window.__FRUITBACK_PLAYGROUND__ = { workerOrigin: '%WORKER_ORIGIN%' };
    </script>
    <script src="/client.js"></script>
  </body>
</html>
