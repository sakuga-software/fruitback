# The Fruitback worker, from its published image (SKG-541). Nothing here needs a clone of this
# repository:
#
#   curl -fsSLO https://raw.githubusercontent.com/sakuga-software/fruitback/main/docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/sakuga-software/fruitback/main/.env.example -o .env
#   (set ALLOWED_ORIGINS in .env)
#   docker compose up -d --wait
#
# While the repository is private, the downloads and the image need a GitHub login: see the README.
# Compose does not pull an image tag that is already on the machine. To update, run this first:
#   docker compose pull
#
# Every variable comes from .env, and .env.example lists exactly the variables this file reads.
# compose.test.ts in apps/worker compares this file with the variables the worker reads, so a new
# variable fails the test suite until it is added here and in .env.example.
services:
  worker:
    image: ${FRUITBACK_IMAGE:-ghcr.io/sakuga-software/fruitback-worker:edge}
    restart: unless-stopped
    ports:
      # If a reverse proxy is in front, remove this mapping. See the Traefik block below.
      - '${FRUITBACK_PORT:-8080}:8080'
    volumes:
      # The SQLite seeds and the extension's sessions. A live database keeps recent writes in a log
      # beside the file, so back it up through the running container and never with cp:
      #   docker compose exec worker sqlite3 /data/fruitback.db ".backup '/data/backup.db'"
      - fruitback-data:/data
    # To put Traefik in front instead of publishing the port:
    #   1. Remove the ports mapping above.
    #   2. Set TRUSTED_PROXY_HOPS=1 in .env.
    #   3. Uncomment the labels and networks below, and the networks block at the end of the file.
    # labels:
    #   traefik.enable: 'true'
    #   traefik.http.routers.fruitback.rule: Host(`feedback.example.com`)
    #   traefik.http.routers.fruitback.entrypoints: websecure
    #   traefik.http.routers.fruitback.tls.certresolver: letsencrypt
    #   traefik.http.services.fruitback.loadbalancer.server.port: '8080'
    # networks: [traefik]
    environment:
      # The port inside the container. The image exposes 8080 and its healthcheck probes it.
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      # WARNING: this value must be the number of proxies in front of the container. This file
      # publishes the port directly, so the default is 0. If it is too high, a caller writes its
      # own address in X-Forwarded-For and gets a new rate-limit bucket on every request.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      FRUITBACK_STORE: ${FRUITBACK_STORE:-sqlite}
      FRUITBACK_SQLITE_PATH: ${FRUITBACK_SQLITE_PATH:-/data/fruitback.db}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      FRUITBACK_CLIENTS: ${FRUITBACK_CLIENTS:-}
      FRUITBACK_IDENTITY_SECRET: ${FRUITBACK_IDENTITY_SECRET:-}
      FRUITBACK_READ: ${FRUITBACK_READ:-}
      FRUITBACK_HIDE_COMMENTS: ${FRUITBACK_HIDE_COMMENTS:-}
      FRUITBACK_SESSION_PATH: ${FRUITBACK_SESSION_PATH:-}

volumes:
  fruitback-data:
    # Without a name, Compose prefixes the project name, and `docker run -v fruitback-data:/data`
    # then opens a different, empty volume.
    name: fruitback-data

