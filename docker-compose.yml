# Local run and self-host reference. Dokploy builds the same Dockerfile from the GitHub push and
# injects the environment itself, so it does not read this file — keep the two in sync by hand.
services:
  worker:
    build:
      # Repo root: the build needs the workspace lockfile and packages/shared.
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    ports:
      - '${PORT:-8080}:8080'
    environment:
      PORT: 8080
      # Client site origins allowed to post feedback. `*` is fine for a preview, wrong in production.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS}
      LINEAR_API_KEY: ${LINEAR_API_KEY:?set LINEAR_API_KEY}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:?set LINEAR_TEAM_ID}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      # One hop = Traefik in front. Getting this wrong makes the rate limit forgeable.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # `public` (default) or `authenticated`. Public reads answer anyone who can build the URL —
      # right for anonymous feedback, wrong for internal review. `authenticated` needs
      # FRUITBACK_IDENTITY_SECRET and is refused at boot without one.
      FRUITBACK_READ: ${FRUITBACK_READ:-public}
      FRUITBACK_IDENTITY_SECRET: ${FRUITBACK_IDENTITY_SECRET:-}
      # The browser extension's sessions, and empty means the /session endpoints are off. Not the
      # seed store: credentials are not seeds, so this is its own file whatever FRUITBACK_STORE says.
      # It needs FRUITBACK_IDENTITY_SECRET, and a persistent volume — see .env.example.
      # Mint a code with: docker compose exec worker node server.mjs pair --subject alice
      FRUITBACK_SESSION_PATH: ${FRUITBACK_SESSION_PATH:-}
