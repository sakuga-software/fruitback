# The Fruitback worker, from its published image (FRU-48), with its PostgreSQL and its console. Every
# worker keeps its notes, its sites, its accounts and its sessions in PostgreSQL (FRU-225), so the
# three always start together. Nothing here needs a clone of this repository:
#
#   curl -fsSLO https://raw.githubusercontent.com/sakuga-software/fruitback/main/docker-compose.yml
#   curl -fsSL https://raw.githubusercontent.com/sakuga-software/fruitback/main/.env.example -o .env
#   (in .env: ALLOWED_ORIGINS, FRUITBACK_FIRST_ADMIN, and the three secrets, each with its command)
#   docker compose up -d --wait
#   docker compose logs worker      (the sign-in link of the first administrator)
#
# While the repository is private, the downloads and the image need a GitHub login: see the README.
# If your .env comes from before FRU-225 (no FRUITBACK_DATABASE_URL), the worker refuses to start and
# says why: read « Upgrading » in docs/self-hosting.md first.
# Compose does not pull an image tag that is already on the machine. To update, run this first:
#   docker compose pull
#
# Every value comes from .env, except PORT inside the container, which is always 8080.
# .env.example lists exactly the variables this file reads.
# compose.test.ts in apps/worker compares this file with the variables the worker reads, so a new
# variable fails the test suite until it is added here and in .env.example.
services:
  worker:
    image: ${FRUITBACK_IMAGE:-ghcr.io/sakuga-software/fruitback-worker:edge}
    restart: unless-stopped
    # The worker applies its migrations at its first request that needs the database: it waits for
    # the database to answer, so that its first requests do not answer 502.
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # If a reverse proxy is in front, remove this mapping. See the Traefik block below.
      - '${FRUITBACK_PORT:-8080}:8080'
    volumes:
      # The SQLite files of a worker of before FRU-225, if this stack had them: `migrate-to-postgres`
      # reads them here, once, as « Upgrading » in docs/self-hosting.md says. The worker writes
      # nothing here any more.
      - fruitback-data:/data
    # To put Traefik in front instead of publishing the port:
    #   1. Remove the ports mapping above.
    #   2. Set TRUSTED_PROXY_HOPS=1 in .env.
    #   3. Uncomment the labels and networks below, and the networks block at the end of the file.
    # labels:
    #   traefik.enable: 'true'
    #   traefik.http.routers.fruitback.rule: Host(`feedback.example.com`)
    #   traefik.http.routers.fruitback.entrypoints: websecure
    #   traefik.http.routers.fruitback.tls.certresolver: letsencrypt
    #   traefik.http.services.fruitback.loadbalancer.server.port: '8080'
    # networks: [traefik]
    environment:
      # The port inside the container. The image exposes 8080 and its healthcheck probes it.
      PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS in .env}
      # WARNING: this value must be the number of proxies in front of the container. This file
      # publishes the port directly, so the default is 0. If it is too high behind nothing, or behind
      # a proxy that appends to X-Forwarded-For, a caller writes its own address there and gets a new
      # rate-limit bucket on every request. Behind Traefik or Caddy, a value that is too high puts every
      # caller in one bucket.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      # Empty: the worker's default, `postgres`. Not written here: a `.env` of before with a key of
      # Linear and no FRUITBACK_STORE is then refused with a sentence, and never moved in silence.
      FRUITBACK_STORE: ${FRUITBACK_STORE:-}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID:-}
      FRUITBACK_GITHUB_APP_ID: ${FRUITBACK_GITHUB_APP_ID:-}
      FRUITBACK_GITHUB_PRIVATE_KEY: ${FRUITBACK_GITHUB_PRIVATE_KEY:-}
      FRUITBACK_GITHUB_REPOSITORY: ${FRUITBACK_GITHUB_REPOSITORY:-}
      FRUITBACK_IDENTITY_SECRET: ${FRUITBACK_IDENTITY_SECRET:-}
      FRUITBACK_READ: ${FRUITBACK_READ:-}
      FRUITBACK_HIDE_COMMENTS: ${FRUITBACK_HIDE_COMMENTS:-}
      FRUITBACK_TEAM_LOCALE: ${FRUITBACK_TEAM_LOCALE:-}
      FRUITBACK_FIRST_ADMIN: ${FRUITBACK_FIRST_ADMIN:-}
      # The database of this file, unless .env names another one. The password is the one the
      # `postgres` service makes its database with.
      FRUITBACK_DATABASE_URL: ${FRUITBACK_DATABASE_URL:-postgres://fruitback:${FRUITBACK_POSTGRES_PASSWORD}@postgres:5432/fruitback}
      FRUITBACK_DATABASE_SCHEMA: ${FRUITBACK_DATABASE_SCHEMA:-}
      FRUITBACK_CONSOLE_URL: ${FRUITBACK_CONSOLE_URL:-}
      FRUITBACK_MAIL_FROM: ${FRUITBACK_MAIL_FROM:-}
      FRUITBACK_SCALEWAY_TEM: ${FRUITBACK_SCALEWAY_TEM:-}
      FRUITBACK_PUBLIC_URL: ${FRUITBACK_PUBLIC_URL:-}
      FRUITBACK_GOOGLE_OAUTH: ${FRUITBACK_GOOGLE_OAUTH:-}
      FRUITBACK_LINEAR_OAUTH: ${FRUITBACK_LINEAR_OAUTH:-}
      FRUITBACK_GITHUB_CONNECTOR: ${FRUITBACK_GITHUB_CONNECTOR:-}
      FRUITBACK_GITHUB_CONNECTOR_PRIVATE_KEY: ${FRUITBACK_GITHUB_CONNECTOR_PRIVATE_KEY:-}
      FRUITBACK_SECRETS_KEY: ${FRUITBACK_SECRETS_KEY:-}
      FRUITBACK_AUTH_SECRET: ${FRUITBACK_AUTH_SECRET:-}
      FRUITBACK_AUTH_GITHUB_OAUTH: ${FRUITBACK_AUTH_GITHUB_OAUTH:-}
      FRUITBACK_AUTH_TRACK_IP: ${FRUITBACK_AUTH_TRACK_IP:-}
      FRUITBACK_SIGN_UP: ${FRUITBACK_SIGN_UP:-}
      # The variables of before FRU-150 and FRU-225, which the worker no longer takes. They are handed
      # over so that a `.env` that still sets one stops the worker with a sentence, and is not ignored.
      FRUITBACK_ACCOUNTS_PATH: ${FRUITBACK_ACCOUNTS_PATH:-}
      FRUITBACK_GITHUB_OAUTH: ${FRUITBACK_GITHUB_OAUTH:-}
      FRUITBACK_CLIENTS: ${FRUITBACK_CLIENTS:-}
      FRUITBACK_SESSION_PATH: ${FRUITBACK_SESSION_PATH:-}
      FRUITBACK_SQLITE_PATH: ${FRUITBACK_SQLITE_PATH:-}
      FRUITBACK_FIRST_REVIEWER: ${FRUITBACK_FIRST_REVIEWER:-}

  # PostgreSQL (FRU-143), which every worker needs since FRU-225. Set FRUITBACK_POSTGRES_PASSWORD in
  # .env: this file refuses to start without it. The worker gets the same password in the address
  # above. To keep the worker in a database you already run instead, set FRUITBACK_DATABASE_URL (and
  # FRUITBACK_DATABASE_SCHEMA for a schema of its own). Then either leave this service running, with
  # its password still required, or remove it together with the `depends_on` block of the worker:
  # without that block removed too, Compose refuses a service that waits for one that is not there.
  # No port is published: the worker reaches the database on the network of this file, and nothing
  # else does. Back it up with pg_dump, never with a copy of its volume: see docs/self-hosting.md.
  postgres:
    # The image CI tests the worker against. compose.test.ts compares the two.
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: fruitback
      POSTGRES_DB: fruitback
      # There is no default: with no password this file stops before it starts anything.
      POSTGRES_PASSWORD: ${FRUITBACK_POSTGRES_PASSWORD:?set FRUITBACK_POSTGRES_PASSWORD in .env, for example with openssl rand -hex 32}
    volumes:
      - fruitback-postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: the image answers on its socket while it is still making the database.
      test: ['CMD', 'pg_isready', '-h', '127.0.0.1', '-U', 'fruitback', '-d', 'fruitback']
      interval: 5s
      timeout: 5s
      retries: 12

  # The console (FRU-222): the screens where a person signs in, makes a workspace and adds its sites.
  # Static files and nothing else: it holds no secret, and it calls the worker from the browser.
  # Two values of .env say where the two answer, as a browser reaches them:
  #   FRUITBACK_PUBLIC_URL    the worker   (on this machine: http://localhost:8080)
  #   FRUITBACK_CONSOLE_URL   the console  (on this machine: http://localhost:8081)
  # Two addresses, not one: the worker answers the console as another origin, and the cookie of the
  # session is the worker's. Behind a proxy, give them two names of one domain (api. and app.).
  # A console with no FRUITBACK_PUBLIC_URL stops when it starts, and says so in its log.
  console:
    image: ${FRUITBACK_CONSOLE_IMAGE:-ghcr.io/sakuga-software/fruitback-console:edge}
    restart: unless-stopped
    ports:
      # If a reverse proxy is in front, remove this mapping, as for the worker.
      - '${FRUITBACK_CONSOLE_PORT:-8081}:8080'
    # The image runs as a user that is not root, and writes under /tmp only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The address the browser calls the worker at. It goes into the page and into its
      # Content-Security-Policy when the container starts: no image is built for it.
      FRUITBACK_API: ${FRUITBACK_PUBLIC_URL:-}
      # The port inside the container. The image listens on 80 by default; no user but root opens
      # that port on every runtime, so this file asks for 8080.
      FRUITBACK_CONSOLE_LISTEN: 8080

volumes:
  # Compose prefixes this volume with the project name, so two stacks on one host keep separate data
  # and `docker compose down -v` in one stack cannot delete the other's. It is therefore not the
  # volume that `docker run -v fruitback-data:/data` opens.
  fruitback-data:
  # The database of the `postgres` service.
  fruitback-postgres:

